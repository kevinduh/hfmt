# Base config for SFT experiments (features 08, 09). Components only, never experiments.
# An experiment (egs/<dataset>/<pair>/<name>.yaml) starts its defaults with `- config` to pull
# this in, then `- dataset` and `override <group>: <option>` lines.
# Schema (types only, no values): hfmt/hydra_config.py. Defaults live in yaml only, never in the schema:
# project-wide settings here, swappable bundles in conf/<group>/ (each file's header says what it is
# for), the rest in the experiment folder.
defaults:
  - base_config            # typed schema: validates everything below
  - train: shortrun        # conf/train/*.yaml
  - peft: qlora_default    # conf/peft/*.yaml
  - decode: default
  - _self_

# sbatch resources, read by hfmt/grid.py (override per experiment or e.g. slurm.gres=gpu:l40s:1).
slurm:
  partition: gpu
  gres: gpu:a100:1
  time: "4:00:00"
  mem_gb: 25
  cpus: 1
  array_parallelism: 4

# W&B: config and aggregate metrics only, never data (CLAUDE.md). Experiments set tags.
wandb:
  enabled: true
  project: hfmt
  tags: []                  # entity: unset = your W&B default entity (set it here or per experiment)

inf_name: test              # inference (egs/launch.sh inf) output subfolder: <run folder>/inf/<inf_name>/

hydra:
  job:
    chdir: false            # stay in the launch dir; the code writes to the run dir explicitly
