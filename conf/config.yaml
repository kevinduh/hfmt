# Top-level Hydra config for HFMT SFT experiments (feature 00_hydra).
#
# Composes the config groups below onto the structured schema (base_config,
# registered from hfmt/hydra_config.py) so every value is type-validated.
# Select an experiment (normally via egs/run.sh) with the nested group:  +mmtc/fr-en=sft_lora
# (egs/mmtc/fr-en/sft_lora.yaml; see egs/run.sh).
# Override any knob on the CLI, e.g.:    train.learning_rate=2e-4 lora.lora_r=16

defaults:
  - base_config           # structured schema (validates everything below)
  - basemodel: qwen2.5-1.5b
  # No `data` group (feature 06): the conf/data group is gone. An experiment declares its data
  # inline (data_root/src/trg + a dataset.yaml template); defaults come from the DataConfig
  # dataclass. Paths are inflated from the template in code (hfmt/sft_translation.py).
  - train: qlora_default
  - lora: default
  - decode: default
  - _self_                # this file's values win over the groups
  # The launcher is NOT defaulted here (feature 04): a primary-config launcher default
  # would block an experiment from selecting its own (Hydra ignores the experiment's
  # group override once the primary sets one). Instead every experiment SELECTS a
  # launcher in its own defaults list (`- override /hydra/launcher: slurm`), keeping the
  # experiment a flat list of component choices. Absent any selection Hydra falls back to
  # its built-in `basic` (local) launcher.
  # wandb is not a config group anymore (feature 04): its defaults come from the
  # WandbConfig dataclass and experiments set wandb.* inline.

experiment: default
output_root: outputs

hydra:
  # Extend the config search path to egs/ so experiments can live there (feature 04/06).
  # Resolved at compose time from HFMT_ROOT, the repo-wide path anchor, so
  # +<dataset>/<src>-<trg>=<name> finds egs/<dataset>/<src>-<trg>/<name>.yaml under any launcher.
  searchpath:
    - file://${oc.env:HFMT_ROOT}/egs
  # Keep CWD at the launch dir (repo root) so relative paths / HFMT_ROOT still
  # work; the code targets the run dir explicitly.
  #
  # Output layout mirrors the W&B group->run hierarchy so a W&B run maps 1:1 to its
  # output dir (feature 03_output_wandb_align). A sweep (--multirun, the run.sh path) lands at
  #   outputs/<experiment>/sweep-<ts>/<run_label>/
  # where <ts> is the launch timestamp (resolved ONCE here on the login node, so it is shared by
  # every submitit job of the launch and stable across a Slurm requeue) and <run_label> is this
  # job's swept hyperparameters, built by the hfmt_runlabel resolver (hfmt/sft_translation.py).
  # The run-dir basename == the W&B run name (single source of truth), so disk and W&B align.
  # A single-run experiment through run.sh is still --multirun (submitit needs it) but has no
  # swept params (a sweep experiment's grid lives in its own hydra.sweeper.params, feature 07),
  # so <run_label> falls back to the <experiment> name (feature 04) -- so it reads as
  # outputs/<experiment>/sweep-<ts>/<experiment>/ and the W&B run is named <experiment>, grouped
  # under the base group (no -sweep-<ts>). A true in-process single run (no --multirun) lands at
  # outputs/<experiment>/<ts>/.
  job:
    chdir: false
    config:
      # Keep structural selectors out of override_dirname (the resolver also drops them, but
      # this keeps the raw dirname clean too). Data/path keys are dropped in the resolver.
      override_dirname:
        exclude_keys:
          - experiment
          - hydra/launcher
  run:
    dir: ${output_root}/${experiment}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_root}/${experiment}/sweep-${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hfmt_runlabel:${hydra.job.override_dirname},${hydra.job.num},${experiment}}
