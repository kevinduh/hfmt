# Base config for SFT experiments (features 08, 09). Components only, never experiments.
# An experiment (egs/<dataset>/<pair>/<name>.yaml) starts its defaults with `- config` to pull
# this in, then `- dataset` and `override <group>: <option>` lines.
# Schema (types only, no values): hfmt/hydra_config.py. Every default lives in exactly one yaml:
# project-wide settings here, swappable bundles in conf/<group>/, the rest in the experiment folder.
defaults:
  - base_config            # typed schema: validates everything below
  - train: default
  - peft: qlora_default    # full_finetune | lora_default | qlora_default
  - decode: default
  - _self_

# sbatch resources, read by hfmt/grid.py (override per experiment or e.g. slurm.gres=gpu:l40s:1).
# a100 is bf16-capable and allowed by our GPU tier; 4h fits the ~80 min 800-step QLoRA runs
# while staying short enough to backfill.
slurm:
  partition: gpu
  gres: gpu:a100:1
  time: "4:00:00"
  mem_gb: 25
  cpus: 1
  array_parallelism: 4

# W&B: config and aggregate metrics only, never data (CLAUDE.md). Experiments set tags.
wandb:
  enabled: true
  project: hfmt
  entity: null
  tags: []

inf_name: test              # egs/inf.sh output subfolder: <run folder>/inf/<inf_name>/

hydra:
  job:
    chdir: false            # stay in the launch dir; the code writes to the run dir explicitly
