# Slurm submission via hydra-submitit-launcher. Use with multirun (-m):
#   python hfmt/sft_translation.py -m +experiment=mmtc_fr-en_sft1 hydra/launcher=slurm
#
# Mirrors the sbatch line in egs/mmtc/fr-en/sft1.sh:
#   sbatch -p gpu --gres=gpu:a100:1 --time=48:00:00 ...
defaults:
  - submitit_slurm          # plugin base (provides _target_ + full schema)

partition: gpu
# This cluster REQUIRES a GPU type in the GRES spec ("You must always specify a type when
# requesting gpu GRES") and --gres can't OR types, so a single job must commit to ONE type
# -- we can't auto-pick "whichever of a100/l40s is free". We pin a100: bf16-capable
# (bnb_4bit_compute_dtype=bfloat16 needs Ampere+/CC>=8.0, so v100 is out) and allowed by our
# 4gpu_tier (a100=4; h100/h200 are hard-zeroed, gh200 is in the staff-only `arm` partition).
# To run on l40s instead, override on the CLI: hydra.launcher.gres=gpu:l40s:1
gres: gpu:a100:1
# Keep this close to the real runtime: these QLoRA SFT jobs (max_steps~800) run ~80min on
# a100, and an over-long walltime makes a job hard to BACKFILL -- the scheduler won't drop
# it into a briefly-free GPU it's reserving for a higher-priority job. 4h leaves generous
# headroom over the observed ~80min while still far better than the legacy 48h; trim it
# (e.g. hydra.launcher.timeout_min=120) once runtimes are well characterized. (Was 2880/48h
# from the legacy sbatch --time, which suppressed backfill on contended a100s.)
timeout_min: 240            # 4h
tasks_per_node: 1
nodes: 1
cpus_per_task: 8            # from the legacy qsub num_proc=8
mem_gb: 25                  # from the legacy qsub mem_free=25G
name: ${experiment}

# Sweep concurrency cap (feature 02_hydra_sweep): submitit runs a -m sweep as a Slurm job
# array; this limits how many array tasks run at once (matches the 4-node tier). Override on
# the CLI for a smaller sweep, e.g. hydra.launcher.array_parallelism=2. Mind that sweeps are
# cross-products -- the job count grows fast, so a big grid just queues behind this cap.
array_parallelism: 4

# R2 -- bootstrap the compute-node environment before python runs: conda activate +
# module load (install/path.sh), and put HFMT_ROOT on PYTHONPATH so submitit can
# re-import hfmt.* when it unpickles the job. HFMT_ROOT must be exported at submit time;
# Slurm's default --export=ALL (used by submitit) propagates it into the job.
setup:
  - source ${oc.env:HFMT_ROOT}/install/path.sh
  - export PYTHONPATH=${oc.env:HFMT_ROOT}:$PYTHONPATH
