# This config is for running short full fine-tunes on small training sets.

# optimizer and learning rate
max_steps: 150
lr_scheduler_type: cosine
learning_rate: 1e-5
warmup_steps: 10
optim: adamw_torch_fused
seed: 42

# loss function
weight_decay: 0.01
label_smoothing_factor: 0.0
completion_only_loss: true

# batch size
train_batch_size: 32
eval_batch_size: 32
gradient_accumulation_steps: 2
gradient_checkpointing: true
packing: false

# logging
logging_steps: 10
eval_steps: 25
save_steps: ${train.eval_steps}
save_total_limit: 2              # the Trainer always keeps the best + the latest (for resuming); a 3rd buys nothing
inference_callback_interval: 1   # dev decoding + BLEU every N evaluations (and at the last step); 0 = never

# early stopping
load_best_model_at_end: true
metric_for_best_model: eval_bleu_13a   # the target metric
greater_is_better: true
early_stopping_patience: 3       # evaluations without a BLEU gain > threshold: stops 75 steps after the best
early_stopping_threshold: 0.05
