# Short schedule for full fine-tunes on the small mmtc sets (fr-en ~2.5k pairs: one epoch = ~39 steps
# at batch 64; zh-en ~1.6k pairs: ~25 steps). Every full run so far (0.8B/2B/4B/TranslateGemma, lr
# 5e-6 to 2e-5) peaked on dev at step 50 or 100 and then fell, so the 400/1000-step cosine never
# decayed before the best checkpoint. 150 steps (~4 epochs fr-en, ~6 zh-en) lets the lr anneal around
# the peak; evaluating every 25 steps resolves it. Not finer: each 4B checkpoint is ~50 GB.
# Disk per run (2 checkpoints + model/, fp32): ~23 GB 0.8B, ~56 GB 2B, ~118 GB 4B; one checkpoint
# more while a save is written.
# The learning rate is set per model in the experiment (full FT needs far less than LoRA).

# optimizer and learning rate
max_steps: 150
lr_scheduler_type: cosine
learning_rate: 1e-5
warmup_steps: 10
optim: adamw_torch_fused
seed: 42

# loss function
weight_decay: 0.01
label_smoothing_factor: 0.0
completion_only_loss: true

# batch size
train_batch_size: 32
eval_batch_size: 32
gradient_accumulation_steps: 2
gradient_checkpointing: true
packing: false

# logging
logging_steps: 10
eval_steps: 25
save_steps: ${train.eval_steps}
save_total_limit: 2              # the Trainer always keeps the best + the latest (for resuming); a 3rd buys nothing
inference_callback_interval: 1   # dev decoding + BLEU every N evaluations (and at the last step); 0 = never

# early stopping
load_best_model_at_end: true
metric_for_best_model: eval_bleu_13a_lowercase   # the target metric
greater_is_better: true
early_stopping_patience: 3       # evaluations without a BLEU gain > threshold: stops 75 steps after the best
early_stopping_threshold: 0.05
