# Short annealed schedule for LoRA on the small mmtc sets (fr-en ~2.5k pairs: one epoch = ~39 steps at
# batch 64; zh-en ~1.6k pairs: ~25 steps).
# Why (analysis/2026-11-06_mmtc_results_review): with shortrun (cosine over 400 steps, eval every 50)
# every all-linear run at lr >= 1e-4 selected its FIRST evaluation (step 50), so the rising side of the
# dev curve was never seen, and the lr at step 50 was still 98% of peak: no selected checkpoint was ever
# annealed. This schedule makes the cosine decay to zero around the observed peak and evaluates every 10
# steps so the peak is resolved. Experiments sweep max_steps (e.g. 50,100 on fr-en; 50,80 on zh-en);
# keep it a multiple of eval_steps so the annealed final step is also an evaluated, selectable one.
# No early stopping (patience never reached within the run): the point is to see the whole anneal.
# LoRA checkpoints are small (adapter + optimizer state), so saving every 10 steps costs little disk.

# optimizer and learning rate
max_steps: 100
lr_scheduler_type: cosine
learning_rate: 1e-4
warmup_steps: 5
optim: adamw_torch_fused
seed: 42

# loss function
weight_decay: 0.01
label_smoothing_factor: 0.0
completion_only_loss: true

# batch size
train_batch_size: 32
eval_batch_size: 32
gradient_accumulation_steps: 2
gradient_checkpointing: true
packing: false

# logging
logging_steps: 5
eval_steps: 10
save_steps: ${train.eval_steps}
save_total_limit: 2              # the Trainer always keeps the best + the latest (for resuming)
inference_callback_interval: 1   # dev decoding + BLEU at every evaluation (and at the last step)

# early stopping: effectively off (100 evaluations without a gain never happens in <= 100 steps)
load_best_model_at_end: true
metric_for_best_model: eval_bleu_13a_lowercase   # the target metric
greater_is_better: true
early_stopping_patience: 100
early_stopping_threshold: 0.05
