# This config is for running short annealed LoRA experiments on small training sets, without early stopping.

# optimizer and learning rate
max_steps: 100
lr_scheduler_type: cosine
learning_rate: 1e-4
warmup_steps: 5
optim: adamw_torch_fused
seed: 42

# loss function
weight_decay: 0.01
label_smoothing_factor: 0.0
completion_only_loss: true

# batch size
train_batch_size: 32
eval_batch_size: 32
gradient_accumulation_steps: 2
gradient_checkpointing: true
packing: false

# logging
logging_steps: 5
eval_steps: 10
save_steps: ${train.eval_steps}
save_total_limit: 2              # the Trainer always keeps the best + the latest (for resuming)
inference_callback_interval: 1   # dev decoding + BLEU at every evaluation (and at the last step)

# early stopping: effectively off (100 evaluations without a gain never happens in <= 100 steps)
load_best_model_at_end: true
metric_for_best_model: eval_bleu_13a   # the target metric
greater_is_better: true
early_stopping_patience: 100
early_stopping_threshold: 0.05
