# @package _global_
# Default QLoRA SFT example. Based on egs/mmtc/fr-en/sft1.sh but on the smaller 1.5B
# model for faster iteration (sft1.sh used 7B -- override /basemodel: qwen2.5-7b to match).
# Select with:  +experiment=mmtc_fr-en_sft1
# (Hydra "experiment" pattern: this file overrides group choices + values.)
#
# Lives under egs/ (feature 04); Hydra finds it via hydra.searchpath in conf/config.yaml.
# An experiment is a collection of atomistic components (basemodel/data/train/lora/decode)
# plus inline wandb and (feature 04) an inline sweep block added in group E.
defaults:
  - override /basemodel: qwen2.5-1.5b
  - override /data: mmtc_fr-en
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm

experiment: mmtc_fr-en_sft1

# sft1.sh uses seed 37; every other value already matches the group defaults
# (lr 2e-4, reduce_lr_on_plateau, max_steps 800, warmup 30, eval_steps 50,
#  logging 10, batch 16, weight_decay 0.01, lora r=8 target=qv).
train:
  seed: 37

wandb:
  group: mmtc_fr-en_sft1
  tags: [sft, fr-en]

# Inline, toggleable sweep (feature 04). Flip `enabled: true` (or override on the CLI,
# `bash egs/run.sh mmtc_fr-en_sft1 sweep.enabled=true`) to fan out the grid below;
# left off, `bash egs/run.sh mmtc_fr-en_sft1` is a single run. egs/run.sh reads this
# block via hfmt/sweep_probe.py and forwards the axes to --multirun.
#
# This is the former conf/sweep/mmtc_fr-en_coarse.yaml grid (24 jobs =
# learning_rate{2} x lora_target{2} x lora_r{3} x seed{2}). Axes are ordinary Hydra
# overrides: leaf values here, but you can also sweep whole component files, e.g. add
#   basemodel: "qwen2.5-0.5b,qwen2.5-1.5b"
# to sweep across entire base-model configs. CONFIDENTIALITY (CLAUDE.md): axis
# names/values are hyperparameters only, never data content.
sweep:
  enabled: false
  params:
    train.learning_rate: "2e-5,2e-4"
    lora.lora_target: "qv,all-linear"
    lora.lora_r: "8,16,32"
    train.seed: "37,42"
