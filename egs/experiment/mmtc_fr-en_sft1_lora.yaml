# @package _global_
# Case 2: train a SINGLE model WITH LoRA (standard QLoRA SFT).
# This is the canonical single run -- identical to mmtc_fr-en_sft1 but without the
# inline coarse grid. Select with:  bash egs/run.sh mmtc_fr-en_sft1_lora
#
# lora.enabled defaults true and basemodel.load_in_4bit defaults true, so this is a
# 4-bit QLoRA fine-tune; no sweep block -> a single Slurm job.
defaults:
  - override /basemodel: qwen2.5-7b
  - override /data: mmtc_fr-en
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm

experiment: mmtc_fr-en_sft1_lora

train:
  seed: 37

wandb:
  group: mmtc_fr-en_sft1_lora
  tags: [sft, fr-en, lora]
