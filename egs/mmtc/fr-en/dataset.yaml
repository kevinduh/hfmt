# @package data
# MMTC French-English file lists (feature 08). Loaded by Hydra through an experiment's
# `- dataset` default; ${data.*} refer to the experiment's data_root/src/trg. Each split may list
# several files per side (loaded in order, src[i] aligned with trg[i]). Remove `test` to skip
# the final test decoding. Paths only, never data content (CLAUDE.md).
train:
  src:
    - ${data.data_root}/train.${data.src}-${data.trg}.${data.src}
  trg:
    - ${data.data_root}/train.${data.src}-${data.trg}.${data.trg}
dev:
  src:
    - ${data.data_root}/valid.${data.src}-${data.trg}.${data.src}
  trg:
    - ${data.data_root}/valid.${data.src}-${data.trg}.${data.trg}
test:
  src:
    - ${data.data_root}/test.${data.src}-${data.trg}.${data.src}
  trg:
    - ${data.data_root}/test.${data.src}-${data.trg}.${data.trg}
