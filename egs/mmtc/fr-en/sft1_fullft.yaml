# @package _global_
# Case 1: train a SINGLE model with a FULL fine-tune (no LoRA).
# Select with:  bash egs/run.sh mmtc/fr-en/sft1_fullft.yaml
#
# train.finetune_mode=full is the single switch (sft_translation.py dispatches on
# finetune_mode: full | lora | qlora). "full" loads the base UNQUANTIZED and trains
# every parameter -- a full FT cannot run on a 4-bit base, so this mode never
# quantizes and basemodel.load_in_4bit is not consulted (no need to set it here).
#
# BASE MODEL: 0.5B, for the quickest full-FT iteration (1.5B/3B also fit a single GPU;
# 7B full FT -- weights + fp32 optimizer state -- does NOT, so it is not an option here).
defaults:
  - override /basemodel: qwen2.5-0.5b
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm_fullft   # more host RAM + walltime for full FT

experiment: mmtc_fr-en_sft1_fullft

# Dataset (feature 06): see egs/mmtc/fr-en/dataset.yaml; data_root holds the data files.
data:
  data_root: ${oc.env:HFMT_ROOT}/data/fr-en
  src: fr
  trg: en
  instruction: "Translate French to English"

train:
  finetune_mode: full       # full-parameter fine-tune: unquantized base, no adapter
  # Full fine-tuning updates ALL weights, so it needs a much lower LR than LoRA.
  # qlora_default's 2e-4 is a LoRA rate (~20x too high here and would diverge / cause
  # catastrophic forgetting); 2e-5 is the standard full-model SFT rate (try 1e-5-2e-5).
  learning_rate: 2e-5
  seed: 37

wandb:
  group: mmtc_fr-en_sft1_fullft
  tags: [sft, fr-en, fullft]
