# @package _global_
# Case 3: train MULTIPLE models via a sweep with a FULL fine-tune (no LoRA).
# Sweeps across whole base-model configs in full-FT mode. Select with:
#   bash egs/run.sh mmtc/fr-en/sft1_fullft_modelsweep.yaml
#
# train.finetune_mode=full drives it (unquantized base, all params trained). Because
# finetune_mode lives in the unswept train group, it SURVIVES the per-job basemodel
# group swap, so every swept model is loaded full-precision for full fine-tuning --
# no need to pin basemodel.load_in_4bit (full mode never quantizes).
#
# Grid is the two small models (0.5B, 1.5B), both of which full-fine-tune on a single
# GPU. NOTE: 7B full FT (weights + fp32 optimizer state) would OOM a single GPU, so keep
# it out of this grid unless you have the memory.
defaults:
  - override /basemodel: qwen2.5-0.5b
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm_fullft   # more host RAM + walltime for full FT

experiment: mmtc_fr-en_sft1_fullft_modelsweep

# Dataset (feature 06): see egs/mmtc/fr-en/dataset.yaml; data_root holds the data files.
data:
  data_root: ${oc.env:HFMT_ROOT}/data/fr-en
  src: fr
  trg: en
  instruction: "Translate French to English"

train:
  finetune_mode: full       # full-parameter fine-tune; in the unswept train group, so it
                            # survives the per-job basemodel swap (every model loads unquantized)
  # Full-FT LR (see mmtc_fr-en_sft1_fullft): 2e-5, not qlora_default's LoRA-tuned 2e-4.
  learning_rate: 2e-5
  seed: 37

wandb:
  group: mmtc_fr-en_sft1_fullft_modelsweep
  tags: [sft, fr-en, fullft]

sweep:
  enabled: true
  params:
    basemodel: "qwen2.5-0.5b,qwen2.5-1.5b"   # both full-fine-tune on a single GPU
