# @package _global_
# Case 5: train MULTIPLE models via a sweep, WITH LoRA, sweeping across learning rates.
# Sweeps base-model config x learning_rate. Select with:
#   bash egs/run.sh mmtc/fr-en/sft1_lora_model_lr_sweep.yaml
#
# 2 base models x 3 learning rates = 6 jobs, each a 4-bit QLoRA fine-tune. Runs are
# labelled by the selected model file name + the learning rate, e.g.
# basemodel-qwen2.5-1.5b__learning_rate-0.0002.
defaults:
  - override /basemodel: qwen2.5-1.5b
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm

# Dataset (feature 06): see egs/mmtc/fr-en/dataset.yaml; data_root holds the data files.
data:
  data_root: ${oc.env:HFMT_ROOT}/data/fr-en
  src: fr
  trg: en
  instruction: "Translate French to English"

train:
  seed: 37

wandb:
  tags: [sft, lora]

sweep:
  enabled: true
  params:
    basemodel: "qwen2.5-0.5b,qwen2.5-1.5b"
    train.learning_rate: "1e-4,2e-4,3e-4"
