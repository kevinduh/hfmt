# @package _global_
# Refinement sweep for MMTC fr-en (feature 04 successor to conf/sweep/mmtc_fr-en_refine1.yaml).
# Select with:  bash egs/run.sh mmtc/fr-en/sft1_refine1.yaml
#
# Derived from analysis/2026-10-08/summary.md of the 24-run coarse sweep, which found:
#   - lora_r is noise (r=8/16/32 within noise) -> fix r=8 (also makes alpha/r constant).
#   - the only real effects are learning_rate and lora_target; all-linear >= qv, and lr=2e-4
#     was the TOP of the coarse range -> fix all-linear, probe finer + HIGHER lr.
# So this FIXES the coarse winners and extends the step budget, then sweeps lr x seed (8 jobs).
# CONFIDENTIALITY (CLAUDE.md): only hyperparameters here, never data content.
defaults:
  - override /basemodel: qwen2.5-7b
  - override /train: qlora_default
  - override /lora: default
  - override /decode: default
  - override /hydra/launcher: slurm

# Dataset (feature 06): see egs/mmtc/fr-en/dataset.yaml; data_root holds the data files.
data:
  data_root: ${oc.env:HFMT_ROOT}/data/fr-en
  src: fr
  trg: en
  instruction: "Translate French to English"

# Fixed (not swept): the coarse winners + a longer budget.
lora:
  lora_r: 8                 # analysis: lora_r is noise -> fix at 8 (alpha/r = 4 constant)
  lora_target: all-linear   # analysis: all-linear is the winner -> fix it, focus on lr

train:
  max_steps: 1000           # extend past the coarse 800 to probe continued improvement

wandb:
  tags: [sft, refine1]

# A refinement sweep is a sweep by nature -> enabled by default (8 jobs = lr{4} x seed{2}).
# Disable for a single run with `sweep.enabled=false`.
sweep:
  enabled: true
  params:
    train.learning_rate: "1e-4,2e-4,3e-4,5e-4"
    train.seed: "37,42"
