# Sweep experiment: full fine-tune of Qwen3.5-4B, learning rate (2 jobs)
# The 4B reference for the LoRA sweeps (2B full: 63.60 test BLEU 13a lowercase, at lr 2e-5).
# Schedule: shortrun as is (400 steps, ~10 epochs, eval every 50, early stopping after 3). Checkpoints
# are picked on dev BLEU 13a lowercase, the target metric. The 0.8B/2B full fine-tunes at lr 2e-5
# peaked at their first evaluation (step 50), so their peak was never resolved. 2e-5 is left out:
# 5e-6 and 1e-5 should peak later, where evaluating every 50 steps can see it.
# Memory (tools/inspect_model.py): fp32 weights + grads + AdamW state = 16 bytes/param, 62.7 GiB for
# 4.21B parameters, + 3.6 MiB per token in a batch: needs an 80 GB A100 (not a 40 GB A100 or a 48 GB
# L40S). Per-device batch 4 x accumulation 16 keeps the effective batch at 64, as in
# sft_translategemma-4b-it.yaml.
# Disk: each checkpoint holds fp32 weights + AdamW state, ~50 GB; save_total_limit 3 keeps ~150 GB per
# job: clear checkpoints when done (tools/delete_checkpoints.sh).
# Decodes at the default batch size (16), like the earlier runs: batch size can shift greedy outputs.
# Launch:  bash egs/launch.sh sft egs/mmtc/fr-en/sft_full_qwen-3.5-4b.sweep.yaml
#          (not tools/run_on_free_gpu.sh: it may pick an L40S)
# Jobs land in outputs/sft_full_qwen-3.5-4b_sweep-<idx>/; the .grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: full_finetune
  - override train: shortrun        # cosine, 400 steps, early stopping
  - _self_

run_name: sft_full_qwen-3.5-4b_sweep
checkpoint: Qwen/Qwen3.5-4B
prompt_format: chat
instruction: "Translate French to English"

train:
  metric_for_best_model: eval_bleu_13a_lowercase   # the target metric (shortrun: eval_bleu)
  train_batch_size: 4               # memory only: effective batch 4 x 16 = 64, as shortrun's 32 x 2
  gradient_accumulation_steps: 16

slurm:
  constraint: 80gb                  # 80 GB A100 (see Memory above)
  mem_gb: 48                        # the fp32 model (~16 GB) is loaded in CPU memory before .to(cuda)

wandb:
  tags: [sft, fr-en, full]

hydra:
  sweeper:
    params:
      train.learning_rate: 5e-6,1e-5
