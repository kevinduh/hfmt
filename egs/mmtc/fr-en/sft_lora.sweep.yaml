# Sweep experiment: sft_lora.yaml over a learning-rate x LoRA-rank grid (2 x 2 = 4 jobs).
# Launch:  bash egs/sft.sh egs/mmtc/fr-en/sft_lora.sweep.yaml [overrides]
# Always runs the full grid; a command-line comma list adds an axis, a single value pins one.
# Jobs land in outputs/sft_lora_sweep-<idx>/; outputs/sft_lora_sweep.grid.txt maps idx -> values.
# Change run_name when you change the grid's shape (indexes are positions in the grid).
defaults:
  - config
  - dataset
  - override basemodel: qwen2.5-1.5b
  - override train: qlora_default
  - _self_

run_name: sft_lora_sweep

data:
  data_root: ${oc.env:HFMT_ROOT}/data/fr-en
  src: fr
  trg: en
  instruction: "Translate French to English"

train:
  seed: 37

wandb:
  tags: [sft, fr-en, lora]

hydra:
  sweeper:
    params:
      train.learning_rate: 1e-4,2e-4
      lora.lora_r: 8,16
