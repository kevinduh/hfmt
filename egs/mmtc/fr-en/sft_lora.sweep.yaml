# Sweep experiment
# Launch:  bash egs/launch.sh sft egs/mmtc/fr-en/sft_lora.sweep.yaml [overrides]
# Always runs the full grid; a command-line comma list adds an axis, a single value pins one.
# Jobs land in outputs/sft_lora_sweep-<idx>/; outputs/sft_lora_sweep.grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: lora_default
  - _self_

run_name: sft_lora_sweep
checkpoint: Qwen/Qwen2.5-1.5B-Instruct
instruction: "Translate French to English"

wandb:
  tags: [sft, fr-en, lora]

hydra:
  sweeper:
    params:
      train.learning_rate: 1e-4,1e-5
      peft.lora.lora_r: 8,16
