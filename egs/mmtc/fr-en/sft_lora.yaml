# Single-run experiment
# Launch:  bash egs/launch.sh sft egs/mmtc/fr-en/sft_lora.yaml [overrides]
# Debug:   source egs/mmtc/fr-en/local_setting.sh &&
#          python -m hfmt.sft_translation --config-dir egs/mmtc/fr-en --config-name sft_lora
defaults:
  - config                          # conf/config.yaml: schema + default components
  - dataset                         # ./dataset.yaml: data root, languages, train/dev/test files
  - override peft: lora_default
  - _self_

run_name: sft_lora
checkpoint: Qwen/Qwen2.5-1.5B-Instruct
instruction: "Translate French to English"

wandb:
  tags: [sft, fr-en, lora]
