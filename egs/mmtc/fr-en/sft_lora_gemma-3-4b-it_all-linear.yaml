# Single-run experiment: LoRA (every linear layer) fine-tune of google/gemma-3-4b-it
# TranslateGemma (translategemma-4b-it) is this model fine-tuned for translation. After SFT on this data
# TranslateGemma ties Qwen3.5-4B (67.76 vs 68.20 test BLEU-lc) although it starts 8.5 lower zero-shot
# (analysis/2026-11-06_mmtc_results_review). This runs TranslateGemma's all-linear recipe on its base
# model: if Gemma 3 lands at the same score, the MT specialisation buys nothing on in-domain data; its
# zero-shot score says whether TranslateGemma's zero-shot deficit against Qwen comes from the base.
# Same architecture as TranslateGemma, so the same peft option (lora_gemma3_all_linear, 7 module names),
# the same vision tower kept out by NON_LANGUAGE_MODULES (hfmt/mt_model.py), and the same memory: the
# logits dominate (262k vocabulary), hence batch 16 x accumulation 4 (effective 64, as shortrun's 32 x 2).
# A job that OOMs is resumed on an 80 GB A100 (bash egs/launch.sh sft <run folder>/run_config.yaml
# slurm.constraint=80gb).
# Prompt: the plain `chat` format (instruction + source in the user turn, Gemma 3's own chat template;
# enable_thinking is ignored by templates without it). TranslateGemma's fix_template does not apply here:
# check the training log for TRL's "Mismatch between tokenized prompt" warning (tools/run_status.py
# flags it); a hit means Gemma 3's shipped template has the same whitespace defect and needs a format entry.
# Recipe: as sft_lora_translategemma-4b-it_all-linear.sweep.yaml at lr 1e-4 (the all-linear lr axis is
# flat within noise): shortrun, 400-step cosine, eval every 50, early stopping after 3, BLEU-lc selection.
# A comma list on the command line adds an lr axis (train.learning_rate=1e-4,2e-4; change run_name).
# Launch:    bash egs/launch.sh sft egs/mmtc/fr-en/sft_lora_gemma-3-4b-it_all-linear.yaml
# Zero-shot: bash egs/launch.sh inf egs/mmtc/fr-en/sft_lora_gemma-3-4b-it_all-linear.yaml
#            -> outputs/sft_lora_gemma-3-4b-it_all-linear/base_ckpt_inf/test/scores.json
# Test:      bash egs/launch.sh inf egs/mmtc/fr-en/outputs/sft_lora_gemma-3-4b-it_all-linear/run_config.yaml
defaults:
  - config
  - dataset
  - override peft: lora_gemma3_all_linear
  - override train: shortrun        # cosine, 400 steps, early stopping
  - _self_

run_name: sft_lora_gemma-3-4b-it_all-linear
checkpoint: google/gemma-3-4b-it
prompt_format: chat
instruction: "Translate French to English"

train:
  learning_rate: 1e-4
  metric_for_best_model: eval_bleu_13a_lowercase   # the target metric (shortrun: eval_bleu)
  train_batch_size: 16              # memory only (logits, see above): effective batch 16 x 4 = 64
  gradient_accumulation_steps: 4

wandb:
  tags: [sft, fr-en, lora]
