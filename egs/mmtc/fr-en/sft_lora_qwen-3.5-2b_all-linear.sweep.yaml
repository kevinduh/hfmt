# Sweep experiment: LoRA (every linear layer) fine-tune of Qwen3.5-2B, learning rate (4 jobs)
# The 2B point of the all-linear scaling curve, and the one size with a full fine-tune to compare
# against (2B full: 63.60 test BLEU 13a lowercase). Its matched [q_proj, v_proj] baseline is
# sft_lora_qwen-3.5-2b_q-v-proj.sweep.yaml (same schedule and checkpoint selection).
# Schedule: shortrun as is (400 steps, ~10 epochs, eval every 50, early stopping after 3). Checkpoints
# are picked on dev BLEU 13a lowercase, the target metric.
# lr 3e-5 extends the usual 5e-5,1e-4,2e-4 bracket downward, in case every layer wants a lower one.
# Decodes at the default batch size (16), like the earlier runs: batch size can shift bf16 greedy outputs.
# Launch:  bash tools/run_on_free_gpu.sh sft egs/mmtc/fr-en/sft_lora_qwen-3.5-2b_all-linear.sweep.yaml
# Jobs land in outputs/sft_lora_qwen-3.5-2b_all-linear_sweep-<idx>/; the .grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: lora_qwen3_5_all_linear
  - override train: shortrun        # cosine, 400 steps, early stopping
  - _self_

run_name: sft_lora_qwen-3.5-2b_all-linear_sweep
checkpoint: Qwen/Qwen3.5-2B
prompt_format: chat
instruction: "Translate French to English"

train:
  metric_for_best_model: eval_bleu_13a_lowercase   # the target metric (shortrun: eval_bleu)

wandb:
  tags: [sft, fr-en, lora]

hydra:
  sweeper:
    params:
      train.learning_rate: 3e-5,5e-5,1e-4,2e-4
