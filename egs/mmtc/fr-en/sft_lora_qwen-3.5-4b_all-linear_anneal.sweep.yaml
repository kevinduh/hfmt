# Sweep experiment: LoRA (every linear layer) fine-tune of Qwen3.5-4B, annealed short schedule
# (lr x max_steps, 4 jobs)
# Follow-up to sft_lora_qwen-3.5-4b_all-linear.sweep.yaml (400-step cosine, eval every 50): its lr 1e-4 and
# 2e-4 jobs both selected their first evaluation (step 50, 1.3 epochs) at 98% of peak lr, so the peak was
# never resolved and never annealed (analysis/2026-11-06_mmtc_results_review). Same recipe otherwise.
# Schedule: lora_anneal_short (cosine to zero over max_steps, warmup 5, eval + dev BLEU every 10 steps,
# no early stopping). max_steps 50 anneals at the old selected step; 100 (~2.6 epochs) anneals past it.
# Compare each job with the 400-step run's step-50 checkpoint at the same lr: a gain of more than the noise
# band (~0.5 BLEU-lc test, less on dev) means the schedule matters and the all-linear results should be
# re-based on it.
# Memory as the 400-step sweep (bf16 weights 7.8 GiB + logits): batch 32 on a 40 GB A100 or an L40S
# (slurm.gres=gpu:l40s:1). Each job is ~5-10 min of training plus 5-10 dev decodes of ~30 s.
# Launch:  bash egs/launch.sh sft egs/mmtc/fr-en/sft_lora_qwen-3.5-4b_all-linear_anneal.sweep.yaml
# Jobs land in outputs/sft_lora_qwen-3.5-4b_all-linear_anneal_sweep-<idx>/; the .grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: lora_qwen3_5_all_linear
  - override train: lora_anneal_short   # cosine to zero, eval every 10, BLEU-lc selected, no early stop
  - _self_

run_name: sft_lora_qwen-3.5-4b_all-linear_anneal_sweep
checkpoint: Qwen/Qwen3.5-4B
prompt_format: chat
instruction: "Translate French to English"

wandb:
  tags: [sft, fr-en, lora, anneal]

hydra:
  sweeper:
    params:
      train.learning_rate: 1e-4,2e-4
      train.max_steps: 50,100
