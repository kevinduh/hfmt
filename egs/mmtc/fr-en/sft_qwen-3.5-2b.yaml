# Single-run experiment: full fine-tune of all Qwen3.5-0.8B parameters
# Launch:  bash egs/launch.sh sft egs/mmtc/fr-en/sft_qwen-3.5-0.8b.yaml [overrides]
# Debug:   source egs/mmtc/fr-en/local_setting.sh &&
#          python -m hfmt.sft_translation --config-dir egs/mmtc/fr-en --config-name sft_qwen-3.5-0.8b
defaults:
  - config                          # conf/config.yaml: schema + default components
  - dataset                         # ./dataset.yaml: data root, languages, train/dev/test files
  - override peft: full_finetune
  - override train: midrun          # cosine, 2e-5, 1000 steps, BLEU-selected
  - _self_

run_name: sft_full_qwen-3.5-2b
checkpoint: Qwen/Qwen3.5-2B
prompt_format: chat
instruction: "Translate French to English"

wandb:
  tags: [sft, fr-en, full]
