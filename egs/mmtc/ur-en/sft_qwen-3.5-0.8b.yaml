# Single-run experiment: full fine-tune of all Qwen3.5-0.8B parameters
# ur-en counterpart of egs/mmtc/zh-en/sft_qwen-3.5-0.8b.yaml: same recipe; run_name carries the pair so the
# pairs' W&B groups don't merge. A point of the ur-en model-size curve with sft_qwen-3.5-4b.yaml.
# lr 1e-5, as on zh-en, where 2e-5 (midrun) peaked at its first evaluation and then fell, i.e. overshot.
# Schedule: full_finetune_short (150-step cosine, warmup 10, eval + dev BLEU every 25 steps, early stopping
# after 3), sized for the ~1.6k-2.5k pairs of the other mmtc pairs.
# Urdu tokenises longer than French; if a job OOMs, relaunch with a smaller train.train_batch_size (and a
# matching train.gradient_accumulation_steps) and a new run_name (a resume may change only slurm.*).
# Launch:  bash egs/launch.sh sft egs/mmtc/ur-en/sft_qwen-3.5-0.8b.yaml [overrides]
# Test:    bash egs/launch.sh inf egs/mmtc/ur-en/outputs/sft_full_qwen-3.5-0.8b_ur-en_short/run_config.yaml
# Debug:   source egs/mmtc/ur-en/local_setting.sh &&
#          python -m hfmt.sft_translation --config-dir egs/mmtc/ur-en --config-name sft_qwen-3.5-0.8b
defaults:
  - config                          # conf/config.yaml: schema + default components
  - dataset                         # ./dataset.yaml: data root, languages, train/dev/test files
  - override peft: full_finetune
  - override train: full_finetune_short   # cosine, 150 steps, eval every 25, early stopping
  - _self_

run_name: sft_full_qwen-3.5-0.8b_ur-en_short
checkpoint: Qwen/Qwen3.5-0.8B
instruction: "Translate Urdu to English"

train:
  learning_rate: 1e-5

wandb:
  tags: [sft, ur-en, full]
