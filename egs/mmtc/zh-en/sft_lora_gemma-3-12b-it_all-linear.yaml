# Single-run experiment: LoRA (every linear layer) fine-tune of google/gemma-3-12b-it
# The Gemma 3 size step, as sft_lora_qwen-3.5-9b_all-linear* is Qwen3.5's: does Gemma's gap to Qwen close
# with scale? At lr 1e-4 Gemma 3 4B trails Qwen3.5-4B by 1.6 test BLEU-lc
# (32.91 vs 34.53); Qwen3.5 4B -> 9B gained 1.0 (35.55), and this pair has a data ceiling at ~1.6k pairs.
# Low priority: beating 35.55 needs a +2.6 size gain.
# Recipe: sft_lora_gemma-3-4b-it_all-linear* unchanged at lr 1e-4 (the all-linear lr axis was flat for every
# model; one run, as the 9B got): shortrun, 400-step cosine, eval every 50, early stopping after 3, BLEU-lc
# selection, r 8, alpha 32, peft option lora_gemma3_all_linear (same 7 module names as the 4B).
# Inspected (tools/inspect_model.py google/gemma-3-12b-it, 2026-11-11): 48 layers, the same 7 all-linear names
# as the 4B, 32.7M language-model adapter parameters at r=8, lm_head tied; 12.19B parameters in all. As at 4B
# the vision tower's q/k/v_proj also match (1.5M adapter parameters); with no images they get no gradient.
# Prompt: 14 tokens around the source (as the 4B), so TRL's "Mismatch between tokenized prompt" warning is not
# expected (tools/run_status.py flags it).
# Memory: bf16 weights 22.7 GiB + 4.02 MiB per token, so batch 8 x accumulation 8 (effective 64) and eval
# batch 16, as the Qwen3.5-9B runs: ~29 GiB at 8 x 200 tokens, a 40 GB A100 while padded sequences stay
# under ~350 tokens (8 x 512 is ~39 GiB, too tight). If it OOMs, resume on an 80 GB A100
# (bash egs/launch.sh sft <run folder>/run_config.yaml slurm.constraint=80gb).
# Time: the 4B Gemma LoRA took 34 min (fr-en) and 90 min (zh-en) for 200 steps; ~3x the parameters, so 8 h.
# Gated model: accept the license for this repo on the Hub (hf auth login).
# Launch:    bash egs/launch.sh sft egs/mmtc/zh-en/sft_lora_gemma-3-12b-it_all-linear.yaml
# Zero-shot: bash egs/launch.sh inf egs/mmtc/zh-en/sft_lora_gemma-3-12b-it_all-linear.yaml
#            -> outputs/sft_lora_gemma-3-12b-it_zh-en_all-linear/base_ckpt_inf/test/scores.json (the 4B was chatty: read it with the output lengths)
# Test:      bash egs/launch.sh inf egs/mmtc/zh-en/outputs/sft_lora_gemma-3-12b-it_zh-en_all-linear/run_config.yaml
defaults:
  - config
  - dataset
  - override peft: lora_gemma3_all_linear
  - override train: shortrun        # cosine, 400 steps, early stopping
  - _self_

run_name: sft_lora_gemma-3-12b-it_zh-en_all-linear
checkpoint: google/gemma-3-12b-it
instruction: "Translate Chinese to English"

train:
  learning_rate: 1e-4
  metric_for_best_model: eval_bleu_13a_lowercase   # the target metric (shortrun: eval_bleu)
  train_batch_size: 8               # memory only (see above): effective batch 8 x 8 = 64
  gradient_accumulation_steps: 8
  eval_batch_size: 16               # memory only: the eval loss still materialises the logits

slurm:
  mem_gb: 48                        # the bf16 model (~24 GB) passes through CPU memory at load
  time: "8:00:00"                   # see Time above

wandb:
  tags: [sft, zh-en, lora]
