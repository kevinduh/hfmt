# Sweep experiment: LoRA (every linear layer) fine-tune of Qwen3.5-2B, learning rate (4 jobs)
# zh-en counterpart of egs/mmtc/fr-en/sft_lora_qwen-3.5-2b_all-linear.sweep.yaml: same recipe; run_name
# carries the pair so the two pairs' W&B groups don't merge.
# The 2B point of the all-linear scaling curve; compare with the 2B full fine-tune (sft_qwen-3.5-2b.yaml).
# Its matched [q_proj, v_proj] baseline is sft_lora_qwen-3.5-2b_q-v-proj.sweep.yaml.
# Schedule: shortrun as is (400 steps, eval every 50, early stopping after 3), tuned on fr-en's ~2.5k
# training pairs. Checkpoints are picked on dev BLEU 13a lowercase, the target metric.
# lr 3e-5 extends the usual 5e-5,1e-4,2e-4 bracket downward, in case every layer wants a lower one.
# Decodes at the default batch size (16), like the fr-en runs: batch size can shift bf16 greedy outputs.
# Launch:  bash tools/run_on_free_gpu.sh sft egs/mmtc/zh-en/sft_lora_qwen-3.5-2b_all-linear.sweep.yaml
# Jobs land in outputs/sft_lora_qwen-3.5-2b_zh-en_all-linear_sweep-<idx>/; the .grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: lora_qwen3_5_all_linear
  - override train: shortrun        # cosine, 400 steps, early stopping
  - _self_

run_name: sft_lora_qwen-3.5-2b_zh-en_all-linear_sweep
checkpoint: Qwen/Qwen3.5-2B
instruction: "Translate Chinese to English"

train:
  metric_for_best_model: eval_bleu_13a_lowercase   # the target metric (shortrun: eval_bleu)

wandb:
  tags: [sft, zh-en, lora]

hydra:
  sweeper:
    params:
      train.learning_rate: 3e-5,5e-5,1e-4,2e-4
