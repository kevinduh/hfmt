# Sweep experiment: QLoRA fine-tune of Qwen3.5-2B, learning rate x LoRA rank (4 jobs)
# zh-en counterpart of egs/mmtc/fr-en/sft_qlora_qwen-3.5-2b.sweep.yaml: same recipe; run_name carries
# the pair so the two pairs' W&B groups don't merge. The one QLoRA recipe repeated for zh-en: with
# sft_qwen-3.5-2b.yaml it gives the 2B full vs QLoRA comparison that fr-en has.
# Launch:  bash egs/launch.sh sft egs/mmtc/zh-en/sft_qlora_qwen-3.5-2b.sweep.yaml [overrides]
# Always runs the full grid; a command-line comma list adds an axis, a single value pins one.
# Jobs land in outputs/sft_qlora_qwen-3.5-2b_zh-en_sweep-<idx>/; the .grid.txt maps idx -> values.
defaults:
  - config
  - dataset
  - override peft: qlora_default
  - override train: midrun          # cosine, 2e-5, 1000 steps, BLEU-selected
  - _self_

run_name: sft_qlora_qwen-3.5-2b_zh-en_sweep
checkpoint: Qwen/Qwen3.5-2B
prompt_format: chat
instruction: "Translate Chinese to English"

wandb:
  tags: [sft, zh-en, qlora]

hydra:
  sweeper:
    params:
      train.learning_rate: 1e-4,1e-5
      peft.lora.r: 8,16
