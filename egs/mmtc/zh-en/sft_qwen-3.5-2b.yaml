# Single-run experiment: full fine-tune of all Qwen3.5-2B parameters
# zh-en counterpart of egs/mmtc/fr-en/sft_qwen-3.5-2b.yaml: same recipe; run_name carries the pair
# so the two pairs' W&B groups don't merge.
# The 2B reference for the zh-en LoRA/QLoRA sweeps. On fr-en (63.60 test BLEU 13a lowercase) this
# recipe peaked at its first evaluation (step 50), so the peak was never resolved; kept as is so the
# two pairs compare like for like (sft_full_qwen-3.5-4b.sweep.yaml has the lower-lr recipe).
# Launch:  bash egs/launch.sh sft egs/mmtc/zh-en/sft_qwen-3.5-2b.yaml [overrides]
# Debug:   source egs/mmtc/zh-en/local_setting.sh &&
#          python -m hfmt.sft_translation --config-dir egs/mmtc/zh-en --config-name sft_qwen-3.5-2b
defaults:
  - config                          # conf/config.yaml: schema + default components
  - dataset                         # ./dataset.yaml: data root, languages, train/dev/test files
  - override peft: full_finetune
  - override train: midrun          # cosine, 2e-5, 1000 steps, BLEU-selected
  - _self_

run_name: sft_full_qwen-3.5-2b_zh-en
checkpoint: Qwen/Qwen3.5-2B
prompt_format: chat
instruction: "Translate Chinese to English"

wandb:
  tags: [sft, zh-en, full]
