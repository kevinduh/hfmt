# This experiment is for a LoRA SFT of Tiny Aya global on synlrl shn-eng, starting from cpt_lora's merged model.
defaults:
  - config
  - ../dataset
  - override peft: lora_tiny_aya_all_linear
  - _self_

run_name: sft_lora_after_cpt
checkpoint: ${oc.env:HFMT_ROOT}/egs/synlrl/shn-eng/outputs/cpt_lora/model_merged
instruction: "Translate Shan to English"

data:
  src: shn
  trg: eng

decode:
  batch_size: 64

wandb:
  tags: [synlrl, shn-eng, after_cpt]
