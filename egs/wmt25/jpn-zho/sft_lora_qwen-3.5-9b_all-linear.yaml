# This experiment is for running a single all-linear LoRA fine-tune of Qwen3.5-9B on wmt25 jpn-zho.
defaults:
  - config
  - dataset
  - override peft: lora_qwen3_5_all_linear
  - override train: lora_large_data   # cosine, 15k steps (~1 epoch), eval every 500, dev decode every 1000, early stopping
  - _self_

run_name: sft_lora_qwen-3.5-9b_jpn-zho_all-linear
checkpoint: Qwen/Qwen3.5-9B
instruction: "Translate Japanese to Chinese"

train:
  train_batch_size: 8               # memory only: effective batch 8 x 8 = 64
  gradient_accumulation_steps: 8
  eval_batch_size: 8                # memory only: the eval loss materialises the logits of ~800-token dev segments

decode:
  max_new_tokens: 512               # WMT24/WMT24++ references reach ~410 characters (~400 tokens)

slurm:
  mem_gb: 40                        # the bf16 model (~18 GB) passes through CPU memory at load
  time: "4-00:00:00"                # the partition maximum; past it, resume: launch.sh sft <run folder>/run_config.yaml

wandb:
  tags: [sft, jpn-zho, lora]
